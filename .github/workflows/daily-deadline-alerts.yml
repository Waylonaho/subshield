name: Daily SubShield Pro Deadline Alerts

on:
  schedule:
    - cron: '0 13 * * *' # Runs daily at 8:00 AM EST / 1:00 PM UTC
  workflow_dispatch:

jobs:
  trigger-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Run SubShield Deadline Alert Check
        run: |
          curl -f -X GET "https://www.subshieldhq.com/api/cron/deadline-alerts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
